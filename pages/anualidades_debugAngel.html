<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../styles/style.css" rel="stylesheet">
    <title>Calculadora Financiera</title>
</head>
<body>
    <header>
        
    </header>

    <main>
        <h1>Cálculo de Anualidades (Funcionalidad)</h1>

        <section class="control-grupo">
            <h3>Tipo de Anualidad:</h3>
            <label>
                <input type="radio" name="tipoAnualidad" value="ordinaria" checked> Ordinaria (Vencida)
            </label>
            <label>
                <input type="radio" name="tipoAnualidad" value="anticipada"> Anticipada
            </label>
            <label>
                <input type="radio" name="tipoAnualidad" value="diferida"> Diferida
            </label>
        </section>

        <section class="control-grupo">
            <h3>¿Qué deseas calcular?</h3>
            <label><input type="radio" name="variableCalcular" value="cuota" checked> Calcular Cuota (A)</label>
            <label><input type="radio" name="variableCalcular" value="presente"> Calcular Valor Presente (P)</label>
            <label><input type="radio" name="variableCalcular" value="futuro"> Calcular Valor Futuro (F)</label>
            <label><input type="radio" name="variableCalcular" value="tasa"> Calcular Tasa de Interés (i%)</label>
            <label><input type="radio" name="variableCalcular" value="periodos"> Calcular Número de Periodos (N)</label>
            
            <label id="lblCalcularGracia" class="ocultar">
                <input type="radio" name="variableCalcular" value="periodo-gracia"> Calcular Periodos de Gracia (K)
            </label>
        </section>

        <section id="contenedor-base-calculo" class="control-grupo ocultar">
            <h3>Dato financiero conocido:</h3>
            <label>
                <input type="radio" name="baseCalculo" value="usar-presente" checked> Usar Valor Presente (P)
            </label>
            <label>
                <input type="radio" name="baseCalculo" value="usar-futuro"> Usar Valor Futuro (F)
            </label>
        </section>

        <section class="formulario-datos">
            <h3>Variables requeridas:</h3>
            
            <div class="input-box" id="contenedor-tasa">
                <label for="tasaInteres">Tasa de Interés (i %):</label>
                <input type="number" id="tasaInteres" step="any">
            </div>

            <div class="input-box" id="contenedor-periodos">
                <label for="periodos">Número de Periodos de pago (N):</label>
                <input type="number" id="periodos">
            </div>

            <div class="input-box" id="contenedor-anualidad">
                <label for="anualidad">Cuota / Anualidad (A):</label>
                <input type="number" id="anualidad">
            </div>

            <div class="input-box" id="contenedor-presente">
                <label for="valorPresente">Valor Presente (P):</label>
                <input type="number" id="valorPresente">
            </div>

            <div class="input-box" id="contenedor-futuro">
                <label for="valorFuturo">Valor Futuro (F):</label>
                <input type="number" id="valorFuturo">
            </div>

            <div class="input-box" id="contenedor-gracia">
                <label for="periodosGracia">Periodos de Gracia (K):</label>
                <input type="number" id="periodosGracia">
            </div>

            <button type="button" id="btnCalcular">Calcular Resultado</button>
        </section>

        <section class="resultado-caja">
            <h3>Resultado:</h3>
            <p id="txtResultado">Introduce los datos requeridos para procesar el cálculo.</p>
        </section>
    </main>

    <footer>
        <script src="../scripts/anualidades.js"></script>
        <script src="../scripts/script.js"></script>
    </footer>
</body>
</html>
