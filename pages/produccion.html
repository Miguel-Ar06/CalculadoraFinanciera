<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style.css"/>
    <title>Calculadora Financiera</title>
</head>
<body>
    <header>

    </header>

    <main> 
        <h1>Cálculo de Costos y Producción</h1>

        <div class="form-group">
            <label for="modeloCalculo">Seleccione el Modelo Matemático:</label>
            <select id="modeloCalculo" onchange="cambiarModelo()">
                <option value="">-- Seleccione un modelo --</option>
                <optgroup label="Estructura de Costos">
                    <option value="costo_total">Costo Total (CT = CF + v*Q)</option>
                    <option value="punto_equilibrio">Análisis de Punto de Equilibrio</option>
                    <option value="cocomo">Estimación Paramétrica (COCOMO II)</option>
                </optgroup>
                <optgroup label="Ingresos y Capacidad">
                    <option value="ingreso_utilidad">Ingresos y Margen de Beneficio Real</option>
                    <option value="formacion_precio">Formación de Precios (Margen Nominal)</option>
                    <option value="capacidad">Capacidad de Producción (Utilización)</option>
                </optgroup>
            </select>
        </div>

        <div id="seccionVariable" class="form-group hidden">
            <label for="variableObjetivo">¿Qué variable desea calcular (Despejar)?</label>
            <select id="variableObjetivo" onchange="configurarFormulario()"></select>
        </div>

        <div id="formularioCampos" class="hidden form-container">
            <div id="grupo_CT" class="form-group hidden">
                <label for="costoTotal">Costo Total (CT)</label>
                <input type="number" id="costoTotal" min="0">
            </div>
            <div id="grupo_CF" class="form-group hidden">
                <label for="costoFijo">Costo Fijo (CF)</label>
                <input type="number" id="costoFijo" min="0">
            </div>
            <div id="grupo_v" class="form-group hidden">
                <label for="costoVariableUnitario">Costo Variable Unitario (v)</label>
                <input type="number" id="costoVariableUnitario" min="0" step="0.01">
            </div>
            <div id="grupo_Q" class="form-group hidden">
                <label for="cantidad">Cantidad / Producción Real (Q)</label>
                <input type="number" id="cantidad" min="0">
            </div>
            <div id="grupo_P" class="form-group hidden">
                <label for="precioUnitario">Precio Unitario de Venta (P)</label>
                <input type="number" id="precioUnitario" min="0" step="0.01">
            </div>
            
            <div id="grupo_IT" class="form-group hidden">
                <label for="ingresoTotal">Ingreso Total (IT)</label>
                <input type="number" id="ingresoTotal" min="0">
            </div>
            <div id="grupo_U" class="form-group hidden">
                <label for="utilidad">Beneficio Real / Utilidad (U)</label>
                <input type="number" id="utilidad"> </div>
            <div id="grupo_Cu" class="form-group hidden">
                <label for="costoUnitario">Costo Unitario Total (Cu)</label>
                <input type="number" id="costoUnitario" min="0" step="0.01">
            </div>
            <div id="grupo_margen" class="form-group hidden">
                <label for="margenGanancia">Margen de Beneficio Nominal (en decimal, ej: 0.30 para 30%)</label>
                <input type="number" id="margenGanancia" step="0.01">
            </div>

            <div id="grupo_Qmax" class="form-group hidden">
                <label for="capacidadMax">Capacidad Máxima de Producción</label>
                <input type="number" id="capacidadMax" min="0">
            </div>
            <div id="grupo_utilizacion" class="form-group hidden">
                <label for="tasaUtilizacion">Tasa de Utilización (% en decimal, ej: 0.85)</label>
                <input type="number" id="tasaUtilizacion" min="0" max="1" step="0.01">
            </div>
            
            <div id="grupo_modo_cocomo" class="form-group hidden">
                <label for="modoCocomo">Complejidad del Software (COCOMO)</label>
                <select id="modoCocomo">
                    <option value="organico">Orgánico (Pequeño, estable)</option>
                    <option value="semiacoplado">Semi-acoplado (Mediano, mixto)</option>
                    <option value="embebido">Embebido (Rígido, complejo)</option>
                </select>
            </div>
            <div id="grupo_KLOC" class="form-group hidden">
                <label for="kloc">Líneas de Código en Miles (KLOC, min 0)</label>
                <input type="number" id="kloc" min="0" step="0.1">
            </div>
            <div id="grupo_Esfuerzo" class="form-group hidden">
                <label for="esfuerzo">Esfuerzo del Proyecto (E en Personas-Mes)</label>
                <input type="number" id="esfuerzo" min="0" step="0.1">
            </div>

            <button onclick="ejecutarCalculo()">Ejecutar Cálculo</button>
        </div>

        <div id="resultado"></div>
        <a href="index.html"><button class="btn-nav">← Volver al Menú Principal</button></a>
    </main>

    <footer>

    </footer>
    
    <script src='../scripts/produccion.js'></script>
</body>
</html>
