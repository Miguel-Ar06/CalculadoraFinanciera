<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style.css"/>
    <title>Calculadora Financiera - Menú Principal</title>
</head>
<body>
    <header>
        Calculadora Financiera
    </header>

    <main id="home"> 
        <h1>Calculadora Financiera</h1>
        <h3>Seleccione el módulo de cálculo que desea consultar:</h3>

        <!-- Selector de Divisa Global (USD / EUR) y Tasa de Cambio en Bolívares -->
        <div class="form-group" style="background: var(--azul-tenue); padding: 16px; border-radius: 12px; border: 1px solid var(--azul-borde); margin-bottom: 25px;">
            <label style="color: var(--azul-primario); font-size: 15px; font-weight: 700; text-align: center; display: block; margin-bottom: 12px;">
                ⚙️ Configuración Global de Moneda y Tasa de Cambio
            </label>

            <div class="radio-group" style="margin-bottom: 12px; background: transparent; padding: 0; border: none;">
                <label class="radio-option">
                    <input type="radio" name="divisaGlobal" value="$" id="rdUSD" onchange="guardarConfiguracionMoneda()"> Dólar Americano ($ USD)
                </label>
                <label class="radio-option">
                    <input type="radio" name="divisaGlobal" value="€" id="rdEUR" onchange="guardarConfiguracionMoneda()"> Euro (€ EUR)
                </label>
            </div>

            <div style="display: flex; align-items: center; gap: 10px; justify-content: center; flex-wrap: wrap;">
                <label for="tasaCambioBs" style="margin-bottom: 0; font-size: 13px;">Tasa de Cambio (Bs. por <span id="labelDivisaSigla">USD</span>):</label>
                <input type="number" id="tasaCambioBs" step="0.01" value="40.00" style="max-width: 140px; padding: 8px 12px; font-weight: bold; text-align: center;" oninput="guardarConfiguracionMoneda()">
            </div>
            <p style="font-size: 11.5px; color: var(--texto-secundario); text-align: center; margin: 8px 0 0 0;">
                * Los resultados en todas las secciones se mostrarán obligatoriamente en <strong>Bolívares (Bs.)</strong> por defecto y en la divisa seleccionada arriba.
            </p>
        </div>
        
        <!-- Botones de Navegación del Menú Principal -->
        <a href="interes.html"><button type="button">1. Cálculo de Interés (Simple y Compuesto)</button></a>
        <a href="factores.html"><button type="button">2. Factores de Interés Compuesto (F/P, P/F, F/A, A/F, P/A, A/P, P/G, A/G)</button></a>
        <a href="anualidades.html"><button type="button">3. Cálculo de Anualidades</button></a>
        <a href="capital.html"><button type="button">4. Capital y Análisis de Tasas</button></a>
        <a href="costos.html"><button type="button">5. Estructura de Costos y Margen de Beneficio</button></a>
        <a href="alternativas.html"><button type="button">6. Selección de Alternativas Mutuamente Excluyentes</button></a>
        <a href="produccion.html"><button type="button">7. Capacidad de Producción</button></a>
        <a href="depreciacion.html"><button type="button">8. Depreciación y Análisis de Reemplazo</button></a>
        <a href="tributos.html"><button type="button">9. Elementos Tributarios e Impuestos (Venezuela)</button></a>
        <a href="cocomo.html"><button type="button">10. Estimación de Software (COCOMO II)</button></a>
    </main>

    <footer>
        <p>Calculadora Financiera para Ingeniería Económica &copy; 2026</p>
    </footer>

    <script src="../scripts/common.js"></script>
    <script>
        function guardarConfiguracionMoneda() {
            const divisa = document.querySelector('input[name="divisaGlobal"]:checked').value;
            const tasaBs = parseFloat(document.getElementById('tasaCambioBs').value) || (divisa === '€' ? 43.50 : 40.00);
            
            localStorage.setItem('monedaGlobal', divisa);
            localStorage.setItem('moneda', divisa); // compatibilidad
            localStorage.setItem('tasaBs', tasaBs);

            document.getElementById('labelDivisaSigla').textContent = divisa === '€' ? 'EUR (€)' : 'USD ($)';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const divisaGuardada = localStorage.getItem('monedaGlobal') || '$';
            let tasaGuardada = localStorage.getItem('tasaBs');
            
            if (!tasaGuardada) {
                tasaGuardada = divisaGuardada === '€' ? '43.50' : '40.00';
            }

            if (divisaGuardada === '€') {
                document.getElementById('rdEUR').checked = true;
            } else {
                document.getElementById('rdUSD').checked = true;
            }

            document.getElementById('tasaCambioBs').value = tasaGuardada;
            document.getElementById('labelDivisaSigla').textContent = divisaGuardada === '€' ? 'EUR (€)' : 'USD ($)';
        });
    </script>
</body>
</html>
