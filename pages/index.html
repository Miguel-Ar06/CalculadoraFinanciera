<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style.css"/>
    <title>Calculadora Financiera</title>
</head>
<body>
    <header>

    </header>

    <main> 
        <h1>Calculadora Financiera</h1>
        <h3>¿Qué desea calcular?</h3>

        <div class="form-group">
            <label>Moneda de Trabajo:</label>
            <div class="radio-group">
                <label class="radio-option">
                    <input type="radio" name="monedaGlobal" value="$" onchange="guardarMoneda()"> USD ($)
                </label>
                <label class="radio-option">
                    <input type="radio" name="monedaGlobal" value="Bs. " onchange="guardarMoneda()"> Bolívares (Bs.)
                </label>
            </div>
        </div>
        
        <a href="interes.html"><button type="button">Interés</button></a>
        <a href="anualidades.html"><button type="button">Anualidades (En construcción)</button></a>
        <a href="capital.html"><button type="button">Capital y Análisis de Tasas</button></a>
        <a href="produccion.html"><button type="button">Costos y Capacidad de Producción</button></a>
    </main>

    <footer>

    </footer>

    <script>
        function guardarMoneda() {
            const seleccion = document.querySelector('input[name="monedaGlobal"]:checked').value;
            localStorage.setItem('moneda', seleccion);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const monedaGuardada = localStorage.getItem('moneda') || '$';
            const radio = document.querySelector(`input[value="${monedaGuardada}"]`);
            if (radio) {
                radio.checked = true;
            } else {
                document.querySelector('input[value="$"]').checked = true;
                localStorage.setItem('moneda', '$');
            }
        });
    </script>
</body>
</html>
