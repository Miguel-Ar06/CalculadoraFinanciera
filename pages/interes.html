<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="styleshet" href="../styles/style.css"/>
    <title>Calculadora Financiera</title>
</head>
<body>
    <header>
        
    </header>

    <main> 
        <h1>Cálculo de interés</h1>
        <input type="radio" name="tipoInteres" id="rbSimple" value="simple" checked>Simple</input> 
        <input type="radio" name="tipoInteres" id="rbCompuesto" value="compuesto">Compuesto</input> 
        
        <h3>Valores</h3>
        <label for="cantPresente">Cantidad presente (P)</label>
        <input type="number" id="cantPresente" min="0">
            
        <label for="cantFutura">Cantidad futura (F)</label>
        <input type="number" id="cantFutura" min="0">
            
        <label for="tasaInteres">Tasa de interés (i%)</label>
        <input type="number" step=".01" id="tasaInteres" min="0">
            
        <label for="numeroPeriodos">Número de periodos (N)</label>
        <input type="number" id="numeroPeriodos" min="0">
            
        <button onclick="calcular()" name="calcular">Calcular</button>
        <h3 id="resultado">____</h3>
    </main>

    <footer>
        
    </footer>
    
    <script src='../scripts/script.js'></script>
</body>
</html>
